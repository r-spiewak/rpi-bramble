<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
        body {
            font-family: "Lato", sans-serif;
        }

        .sidenav {
            width: 130px;
            /* position: fixed; */
            position: sticky;
            z-index: 1;
            /* top: 60px;
            bottom: 20px; */
            top: 0;
            bottom: 0;
            left: 10px;
            background: #eee;
            /* overflow-x: hidden; */
            overflow-x: scroll;
            height: 80dvh;       /* Sets height to 80% of the viewport height */
            overflow-y: auto;
            padding: 8px 0;
        }

        .sidenav a {
            padding: 6px 8px 6px 16px;
            text-decoration: none;
            font-size: 25px;
            color: #2196F3;
            display: block;
        }

        .sidenav a:hover {
            color: #064579;
        }

        .main {
            margin-left: 140px;
            /* Same width as the sidebar + left position in px */
            font-size: 14px;
            /* Increased text to enable scrolling */
            padding: 0px 10px;
        }

        @media screen and (max-height: 450px) {
            .sidenav {
                padding-top: 15px;
            }

            .sidenav a {
                font-size: 18px;
            }
        }

        /* .sidebar_item_accordian.expanded {
            display: block;
        }

        .sidebar_item_accordian.collapsed {
            display: none;
        } */

        .sidebar_item_accordion.expanded {
            display: block;
        }

        .sidebar_item_accordion.collapsed {
            display: none;
        }

        /* Basic CSS structure for the generated sidebar */
        .sidebar-root {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-root > .sidebar-item {
            list-style: none;
            margin-bottom: 5px;
        }
        .submenu {
            list-style: none;
            padding-left: 1px; /* Indentation for submenus */
            margin-top: 1px;
        }
        .submenu .sidebar-item {
            margin-bottom: 5px;
        }

    </style>
</head>

<body>
    {% if site.sidebar %}
        <!--<div class="sidenav">-->
            {% include sidebar5a.html %}
        <!--</div>-->
    {% endif %}
    <div class="main">
        <h1>{{ page.title }}</h1>
        {{ page.content }}
    </div>
    <script>
        function toggleAccordion(id) {
            console.log("toggleAccordion called with:", id);
            const accordionId = id + "_accordion";
            const accordion = document.getElementById(id + "_accordion");
            const button = document.getElementById(id);
            console.log("button found:", !!button, "accordion found:", !!accordion);

            if (!accordion) {
                console.warn("Accordion element not found:", accordionId);
                return;
            }

            accordion.classList.toggle("expanded");
            accordion.classList.toggle("collapsed");

            if (button) {
                button.classList.toggle("expanded");
                button.classList.toggle("collapsed");
            }
        }
    </script>
</body>

</html>
