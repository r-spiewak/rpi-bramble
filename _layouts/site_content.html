---
layout: default
---
<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
        body {
            font-family: "Lato", sans-serif;
        }

        .sidenav {
            width: 130px;
            position: fixed;
            /* The below makes the actual site content appear below the nav menu */
            /* position: sticky; */
            z-index: 1;
            top: 60px;
            bottom: 20px;
            /* top: 0;
            bottom: 0; */
            /* left: 5px; */
            left: 0;
            background: #eee;
            /* overflow-x: hidden; */
            overflow-x: scroll;
            height: 60dvh;       /* Sets height to 57% of the viewport height; calibrated so it never overlaps the footer - this calibration makes no sense and is heavily dependent on the screensize, so instead just set it to a normal number, e.g., 60  */
            overflow-y: auto;
            padding: 8px 0 8px 0;
        }

        .sidenav a {
            padding: 0px 8px 0px 8px;
            text-decoration: none;
            font-size: 15px;
            color: #2196F3;
            display: block;
        }

        .sidenav a:hover {
            color: #064579;
        }

        .main {
            margin-left: 140px;
            /* Same width as the sidebar + left position in px */
            font-size: 14px;
            /* Increased text to enable scrolling */
            padding: 0px 10px;
        }

        @media screen and (max-height: 450px) {
            .sidenav {
                padding-top: 15px;
            }

            .sidenav a {
                font-size: 18px;
            }
        }

        /* .sidebar_item_accordian.expanded {
            display: block;
        }

        .sidebar_item_accordian.collapsed {
            display: none;
        } */

        .sidebar_item_accordion.expanded {
            display: block;
        }

        .sidebar_item_accordion.collapsed {
            display: none;
        }

        /* Basic CSS structure for the generated sidebar */
        .sidebar-root {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-root > .sidebar-item {
            list-style: none;
            margin-bottom: 5px;
            position: relative;
            padding-left: 0; 
        }
        .submenu {
            list-style: none;
            padding-left: 1px; /* Indentation for submenus */
            margin-left: 2px;
            margin-top: 1px;
        }
        .submenu .sidebar-item {
            margin-bottom: 5px;
            margin-left: calc(var(--submenu-indent, 4px) + 2px);
        }

        .sidebar-item .submenu {
            margin-bottom: 5px;
            margin-left: calc(var(--sidebar-item-indent, 8px) + 6px);
        }

        .sidebar-item-toggle {
            /* Styles for the button/button-like element */
            display: flex;
            /* align-items: center; */
            align-items: left;
            width: 100%;
            background: none;
            border: none;
            padding: 2px 0 0 0px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
        }

        /* .sidebar-item-toggle::before { */
        /* .sidebar-item .level-1::before{ */
        /* .sidebar-item .level-1 { */
        /* .sidebar-item { */
        .sidebar-item .bar {
            content: '';
            display: block;
            width: 0.5px; /* Width of the vertical bar */
            height: 100%;
            background-color: #161616; /* Color of the bar */
            margin-left: 0; /* Ensures it starts exactly at the edge */
            /* padding-right: 1px; */
        }
        /* .sidebar-root > .sidebar-item > .sidebar-item-toggle {
            padding-left: 0; // Reset padding for level 1 items
        } */
        {% comment %}
        /* Level 2 items (Submenus) */
        .submenu .sidebar-item-toggle {
            padding-left: 0; /* This overrides the padding-left set on the UL, making the LI fill the width correctly */
        }

        /* Shading for even/odd levels */
        .level-2 .sidebar-item-toggle {
            background-color: #f9f9f9; /* Light background for Level 2 items */
        }
        /* Add more specific shading for other levels if desired */
        .level-3 .sidebar-item-toggle {
            background-color: #f0f0f0;
        }
        {% endcomment %}

        .sidebar-item-text {
            padding-left: 0; 
        }

        .sidebar-icon {
            border: 1px solid black; 
            padding: 1px; 
            height: 12px; 
            width: 14px;
            transition: transform 0.2s;
            /* Initial state: point right */
            /* For the custom one, it points down, so rotate it: */
            transform: rotate(-90deg);
            display: inline-block;
            transition: transform 0.2s;
        }

        /* State when expanded */
        .sidebar-item-toggle.expanded .sidebar-icon {
            border: 1px solid black; 
            padding: 1px; 
            height: 12px; 
            width: 14px;
            /* Rotate it to point down */
            /* transform: rotate(90deg);  */
            /* For the custom one, it points down, so don't rotate it here: */
            transform: rotate(0deg);
        }

    </style>
</head>

    <script>
        function toggleAccordion(id) {
            console.log("toggleAccordion called with:", id);
            // const accordionId = id + "_accordion";
            // const accordion = document.getElementById(id + "_accordion");
            // const button = document.getElementById(id);
            // console.log("button found:", !!button, "accordion found:", !!accordion);

            // if (!accordion) {
            //     console.warn("Accordion element not found:", accordionId);
            //     return;
            // }

            // accordion.classList.toggle("expanded");
            // accordion.classList.toggle("collapsed");

            // if (button) {
            //     button.classList.toggle("expanded");
            //     button.classList.toggle("collapsed");
            // }

            // 1. Find the associated submenu container using the data attribute
            const targetId = id.getAttribute('data-target');
            const submenu = document.getElementById(targetId);
            console.log("button found:", !!submenu, "accordion found:", !!targetId);
            console.log("button target:", submenu, "accordion target:", targetId);

            // 2. Toggle the display of the submenu
            if (submenu) {
                const isExpanded = id.classList.contains('expanded');
                console.log("expanded (before):", isExpanded);
                
                // Logic to hide/show the submenu
                if (isExpanded) {
                    submenu.style.display = 'none';
                    id.classList.remove('expanded');
                    id.setAttribute('aria-expanded', 'false');
                } else {
                    submenu.style.display = 'block';
                    id.classList.add('expanded');
                    id.setAttribute('aria-expanded', 'true');
                }

                console.log("expanded (after):", id.classList.contains('expanded'));
            }
        }
    </script>

</html>
